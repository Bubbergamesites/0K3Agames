<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta property="og:title" content="Welcome to 0K3A, an ikea themed game site." />
    <meta property="og:description" content="Welcome to 0K3A, an ikea themed game site." />
    <meta name="description" content="Welcome to 0K3A, an ikea themed game site." />
    <meta name="author" content="Bubber" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>0K3A</title>
    <style>
      :root {
        --ikea-blue: #0051ba;
        --ikea-yellow: #ffda1a;
        --ikea-dark: #111111;
        --ikea-gray: #f5f5f5;
      }

      body {
        background-color: var(--ikea-blue);
        color: #ffffff;
        font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .container {
        text-align: center;
        max-width: 650px;
        width: 100%;
      }

      /* Bold, heavy IKEA-style header */
      h1 {
        font-size: 4.5rem;
        font-weight: 900;
        letter-spacing: -2px;
        margin: 0 0 5px 0;
        color: var(--ikea-yellow);
        text-transform: uppercase;
      }

      #subtitle {
        display: block;
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #ffffff;
        margin-bottom: 30px;
        opacity: 0.9;
      }

      .description {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 40px;
        color: #ffffff;
      }

      /* Grid layout mimicking an IKEA product catalog/department layout */
      .nav-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin-bottom: 40px;
      }

      /* Featured "Primary" button takes up full width */
      .nav-grid a.featured {
        grid-column: span 2;
      }

      .ikea-btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        cursor: pointer;
        background-color: var(--ikea-yellow);
        border: none;
        color: var(--ikea-dark);
        padding: 20px 30px;
        text-align: center;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        /* IKEA uses sharp or very slightly rounded corners, not pill shapes */
        border-radius: 6px; 
        transition: background-color 0.15s ease, transform 0.1s ease;
      }

      /* Secondary style for less vital links */
      .ikea-btn.secondary {
        background-color: #ffffff;
        color: var(--ikea-dark);
      }

      .ikea-btn:hover {
        background-color: #ffffff;
        color: var(--ikea-blue);
        transform: scale(1.02);
      }

      .ikea-btn.secondary:hover {
        background-color: var(--ikea-gray);
        color: var(--ikea-dark);
      }

      .ikea-btn:active {
        transform: scale(0.98);
      }

      footer {
        font-size: 0.85rem;
        margin-top: 20px;
        opacity: 0.7;
      }

      footer a {
        color: #ffffff;
        text-decoration: underline;
      }

      /* Responsive adjustment for mobile screens */
      @media (max-width: 480px) {
        h1 { font-size: 3.5rem; }
        .nav-grid { grid-template-columns: 1fr; }
        .nav-grid a.featured { grid-column: span 1; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>0K3A</h1>
        <span id="subtitle">...</span>
      </header>

      <p class="description">
        Welcome to 0K3A, an IKEA-themed game site.
      </p>

      <nav class="nav-grid">
        <a href="/projects" class="featured"><button class="ikea-btn">Start playing!</button></a>
        <a href="/scramjet/"><button class="ikea-btn secondary">Browser</button></a>
        <a href="/scramjet/#https://bubber.pages.dev/movies/"><button class="ikea-btn secondary">Movies</button></a>
        <a href="/apps"><button class="ikea-btn secondary">Apps</button></a>
        <a href="/misc/"><button class="ikea-btn secondary">Other Stuff</button></a>
        <a href="/ai" class="featured"><button class="ikea-btn">Chat with 0K3A AI</button></a>
        <a href="/*.htm" class="featured" target="_blank" rel="noopener noreferrer"><button class="ikea-btn">Use Un-Cloaked</button></a>
      </nav>

      <footer>
        <p>&copy; Bubber, 2026. All rights reserved. Made by Emmett. you know the one.</p>
      </footer>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/subtitle.js"></script>
  </body>
</html>
